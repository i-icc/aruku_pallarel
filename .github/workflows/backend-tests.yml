name: Backend Tests

on:
  pull_request:
    paths:
      - "src/backend/main-backend-server/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Sync Dependencies
        run: uv sync --group dev --no-install-project
        working-directory: src/backend/main-backend-server

      - name: Run Tests
        run: uv run -- python -m pytest
        working-directory: src/backend/main-backend-server
